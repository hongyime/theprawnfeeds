name: Reader checks

on:
  push:
    branches: [main, 'maintenance/feeds-*']
    paths: ['api/**', 'lib/**', 'public/**', 'test/**', 'scripts/test_reader.py', 'scripts/feeds.mjs', 'feeds.json', 'package*.json', 'vercel.json', '.github/workflows/reader-checks.yml']
  pull_request:
    paths: ['api/**', 'lib/**', 'public/**', 'test/**', 'scripts/test_reader.py', 'scripts/feeds.mjs', 'feeds.json', 'package*.json', 'vercel.json', '.github/workflows/reader-checks.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run feeds:check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify reader workflows with synthetic feed responses
        run: python scripts/test_reader.py --report-dir "$RUNNER_TEMP/feeds-browser"
